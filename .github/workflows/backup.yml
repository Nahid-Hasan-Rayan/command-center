name: backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/" > /dev/null

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump --no-owner --no-privileges --format=custom "$SUPABASE_DB_URL"' \
            > backup.dump
          test -s backup.dump

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "${BACKUP_PASSPHRASE}" \
            --symmetric --cipher-algo AES256 --output "backup-$(date -u +%Y%m%d).dump.gpg" backup.dump
          rm backup.dump

      - uses: actions/upload-artifact@v7
        with:
          name: database-backup
          path: backup-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
